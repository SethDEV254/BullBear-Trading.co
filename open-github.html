<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open GitHub Repository</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .github-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .github-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .github-link:active {
            transform: translateY(0);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .repo-url {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #555;
            word-break: break-all;
        }

        .status {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <div class="status">✅ Live on GitHub</div>
        <h1>BullBear Trading</h1>
        <p>Your repository has been successfully pushed to GitHub with all updates including mobile optimization and clickable products fix.</p>
        
        <a href="https://github.com/SethDEV254/BullBear-Trading.co" class="github-link" target="_blank">
            Open Repository
        </a>

        <div class="repo-url">
            https://github.com/SethDEV254/BullBear-Trading.co
        </div>
    </div>

    <script>
        // Auto-redirect after 3 seconds if user doesn't click
        setTimeout(() => {
            if (confirm('Open GitHub repository now?')) {
                window.open('https://github.com/SethDEV254/BullBear-Trading.co', '_blank');
            }
        }, 2000);
    </script>
</body>
</html>
